version: '3.8'

services:
  postgres:
    image: postgres:17
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432" # Permite conexiunea din aplicația ta (ex. din Spring Boot)
    volumes:
      - postgres_data:/var/lib/postgresql/data # Salvează datele fizic în volumul declarat

  pgadmin:
    image: dpage/pgadmin4
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80" # Permite accesarea pgAdmin la http://localhost:5050
    depends_on:
      - postgres # Asigură pornirea bazei de date înaintea interfeței

volumes:
  postgres_data: